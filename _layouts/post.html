---
layout: default
---

<article class="post">
  <div class="container">
    <header class="post-header">
      <div class="post-meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
        {% if page.tags %}
        <div class="post-tags">
          {% for tag in page.tags %}
          <span class="tag">{{ tag }}</span>
          {% endfor %}
        </div>
        {% endif %}
      </div>
      <h1 class="post-title">{{ page.title }}</h1>
      {% if page.description %}
      <p class="post-description">{{ page.description }}</p>
      {% endif %}
    </header>

    {% if page.thumbnail %}
    <div class="post-hero">
      <img src="{{ page.thumbnail | relative_url }}" alt="{{ page.title }}">
    </div>
    {% endif %}

    <div class="post-content">
      {{ content }}
    </div>

    <footer class="post-footer">
      <a href="{{ '/' | relative_url }}" class="back-link">&larr; Back to all projects</a>
    </footer>
  </div>
</article>

<!-- Click a figure to view it full size -->
<div class="lightbox" hidden>
  <img src="" alt="">
</div>
<script>
  (function () {
    var box = document.querySelector('.lightbox');
    var boxImg = box.querySelector('img');
    document.querySelectorAll('.post-content figure img').forEach(function (img) {
      img.addEventListener('click', function () {
        boxImg.src = img.src;
        boxImg.alt = img.alt;
        box.hidden = false;
      });
    });
    function close() { box.hidden = true; boxImg.src = ''; }
    box.addEventListener('click', close);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  })();
</script>
